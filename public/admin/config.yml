# Sveltia CMS 설정 — https://sveltiacms.app/en/docs
# 여기서 정의한 필드가 /admin 편집 화면의 입력 칸이 된다.
# 필드 이름(name)은 src/content.config.ts 의 스키마와 맞춰야 한다.

backend:
  name: github
  repo: eunho5751/eunho5751.github.io
  branch: main
  auth_methods: [token] # GitHub OAuth는 별도 인증 서버가 필요해서 토큰 로그인만 쓴다
  commit_messages:
    create: '{{collection}} 추가: {{slug}}'
    update: '{{collection}} 수정: {{slug}}'
    delete: '{{collection}} 삭제: {{slug}}'
    uploadMedia: '이미지 업로드: {{path}}'
    deleteMedia: '이미지 삭제: {{path}}'

site_url: https://eunho5751.github.io
display_url: https://eunho5751.github.io
logo_url: /favicon.svg

# 업로드한 이미지는 public/images/uploads 에 저장되고, 사이트에서는 /images/uploads/... 로 쓴다.
media_folder: public/images/uploads
public_folder: /images/uploads

media_libraries:
  default:
    config:
      slugify_filename: true
      # 사진을 올리면 WebP로 바꾸고 긴 변을 2000px 이하로 줄여 저장소 용량을 아낀다.
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: '-'

collections:
  # ───────────── 블로그 글 ─────────────
  - name: posts
    label: 블로그 글
    label_singular: 글
    icon: article
    folder: src/content/posts
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug:
      template: '{{title}}'
      editable: [create]
    preview_path: blog/{{slug}}/
    summary: '{{title}} · {{date | date("YYYY-MM-DD")}}{{draft | ternary(" · 초안", "")}}'
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    view_groups:
      - label: 카테고리
        field: category
    fields:
      - { name: title, label: 제목, widget: string }
      - name: description
        label: 요약
        widget: text
        hint: 글 목록과 검색 결과에 보이는 한두 문장
      - name: date
        label: 작성일
        widget: datetime
        type: date
        format: YYYY-MM-DD
        default: '{{now}}'
      - name: updated
        label: 수정일
        widget: datetime
        type: date
        format: YYYY-MM-DD
        required: false
      - name: category
        label: 카테고리
        widget: relation
        collection: categories
        value_field: '{{slug}}'
        search_fields: [name]
        display_fields: [name]
        required: false
      - name: tags
        label: 태그
        widget: list
        required: false
        hint: 쉼표로 구분해서 입력
      - name: banner
        label: 배너 이미지
        widget: image
        required: false
        hint: 글 위쪽과 목록 썸네일에 보입니다. 가로 2:1 비율을 권장합니다.
      - name: bannerAlt
        label: 배너 설명 (대체 텍스트)
        widget: string
        required: false
      - name: draft
        label: 초안
        widget: boolean
        default: false
        hint: 켜 두면 배포된 사이트에는 보이지 않습니다.
      - { name: body, label: 본문, widget: markdown }

  # ───────────── 카테고리 ─────────────
  - name: categories
    label: 카테고리
    label_singular: 카테고리
    icon: category
    folder: src/content/categories
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: name
    slug:
      template: '{{name}}'
      editable: [create]
    summary: '{{name}} (순서 {{order}})'
    sortable_fields:
      fields: [order, name]
      default:
        field: order
        direction: descending
    fields:
      - { name: name, label: 이름, widget: string }
      - { name: description, label: 설명, widget: string, required: false }
      - name: order
        label: 표시 순서
        widget: number
        value_type: int
        default: 0
        hint: 숫자가 클수록 앞에 보입니다.

  # ───────────── 프로젝트 ─────────────
  - name: projects
    label: 프로젝트
    label_singular: 프로젝트
    icon: sports_esports
    folder: src/content/projects
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug:
      template: '{{title}}'
      editable: [create]
    preview_path: projects/{{slug}}/
    summary: '{{title}} · {{period}}'
    sortable_fields:
      fields: [order, title]
      default:
        field: order
        direction: descending
    fields:
      - { name: title, label: 이름, widget: string }
      - { name: summary, label: 한 줄 소개, widget: text }
      - { name: period, label: 기간, widget: string, hint: '예: 2026 — 진행 중' }
      - { name: role, label: 역할, widget: string, required: false }
      - { name: platform, label: 플랫폼, widget: string, required: false }
      - name: stack
        label: 기술 스택
        widget: list
        required: false
        hint: 쉼표로 구분해서 입력 (카드에는 앞 5개만 표시)
      - name: cover
        label: 대표 이미지
        widget: image
        required: false
        hint: 비워 두면 대표 색 그라디언트가 보입니다. 16:9 비율을 권장합니다.
      - { name: accent, label: 대표 색, widget: color, default: '#6366f1' }
      - name: links
        label: 링크 버튼
        widget: list
        required: false
        summary: '{{label}}'
        fields:
          - { name: label, label: 버튼 이름, widget: string }
          - { name: url, label: 주소, widget: string }
      - name: order
        label: 표시 순서
        widget: number
        value_type: int
        default: 0
        hint: 숫자가 클수록 앞에 보입니다.
      - name: featured
        label: 메인 화면에 표시
        widget: boolean
        default: true
      - { name: body, label: 상세 설명, widget: markdown }

  # ───────────── 사이트 설정 ─────────────
  - name: settings
    label: 사이트 설정
    icon: settings
    editor:
      preview: false
    files:
      - name: home
        label: 메인 화면
        file: src/data/home.json
        format: json
        fields:
          - { name: eyebrow, label: 상단 작은 문구, widget: string, required: false }
          - name: heading
            label: 큰 제목
            widget: string
            hint: '[대괄호]로 감싼 부분은 강조 색으로 보입니다. 예: 안녕하세요, [Eunho]입니다.'
          - { name: lead, label: 소개 문단, widget: text, hint: 줄바꿈이 그대로 보입니다. }
          - name: image
            label: 프로필/대표 이미지
            widget: image
            required: false
            hint: 넣으면 소개 오른쪽에 정사각형으로 보입니다.
          - name: buttons
            label: 버튼
            widget: list
            summary: '{{label}}'
            fields:
              - { name: label, label: 버튼 이름, widget: string }
              - { name: url, label: 주소, widget: string, hint: '내부 페이지는 /projects/ 처럼, 외부는 https:// 로' }
              - { name: primary, label: 강조 버튼, widget: boolean, default: false }
          - { name: projectsTitle, label: 프로젝트 섹션 제목, widget: string }
          - { name: projectCount, label: 메인에 보일 프로젝트 수, widget: number, value_type: int, min: 0, default: 4 }
          - { name: postsTitle, label: 글 섹션 제목, widget: string }
          - { name: postCount, label: 메인에 보일 글 수, widget: number, value_type: int, min: 0, default: 5 }

      - name: site
        label: 사이트 정보
        file: src/data/site.json
        format: json
        fields:
          - { name: title, label: 사이트 이름, widget: string, hint: 상단 로고와 브라우저 탭에 보입니다. }
          - { name: author, label: 이름, widget: string }
          - { name: role, label: 직함, widget: string }
          - { name: description, label: 사이트 설명, widget: string, hint: 검색 결과와 링크 미리보기에 쓰입니다. }
          - { name: github, label: GitHub 주소, widget: string }
          - { name: email, label: 공개 이메일, widget: string, required: false }

      - name: about
        label: About 페이지
        file: src/content/pages/about.md
        format: frontmatter
        fields:
          - { name: title, label: 제목, widget: string }
          - { name: lead, label: 한 줄 소개, widget: string, required: false }
          - { name: image, label: 프로필 사진, widget: image, required: false }
          - { name: body, label: 본문, widget: markdown }
